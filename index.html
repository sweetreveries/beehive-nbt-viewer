<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cute Bee NBT Coordinate Parser</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@600;700;800&display=swap');

    :root {
      --pastel-pink: #ffd1dc;
      --pastel-yellow: #fff3b0;
      --pastel-green: #d8f3dc;
      --pastel-purple: #e2d4f0;
      --text-main: #5c4b51;
      --text-muted: #8c7a80;
      --card-bg: rgba(255, 255, 255, 0.85);
      --input-bg: rgba(255, 255, 255, 0.95);
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: url('https://images.unsplash.com/photo-1508615070457-7baeba4003ab?auto=format&fit=crop&w=1920&q=80') center/cover fixed no-repeat;
      color: var(--text-main);
      margin: 0;
      padding: 2rem 1rem;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 850px;
      background: rgba(255, 249, 240, 0.9);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08), inset 0 0 0 2px rgba(255, 255, 255, 0.8);
    }

    h1 {
      font-family: 'Fredoka', cursive;
      margin-top: 0;
      font-size: 2.2rem;
      color: #e07a5f;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      height: 150px;
      background-color: var(--input-bg);
      border: 3px solid var(--pastel-pink);
      border-radius: 18px;
      color: #6b5b60;
      font-family: monospace;
      padding: 1.2rem;
      box-sizing: border-box;
      font-size: 0.88rem;
      resize: vertical;
    }

    textarea:focus {
      outline: none;
      border-color: #f2a65a;
      box-shadow: 0 0 12px rgba(242, 166, 90, 0.4);
    }

    button {
      margin-top: 1.2rem;
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #ffcbf2 0%, #ecbcfd 100%);
      color: #5d3f6a;
      font-family: 'Fredoka', cursive;
      font-size: 1.25rem;
      border: 2px solid #ffffff;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(216, 180, 254, 0.5);
      transition: all 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #f8b4e5 0%, #e1a6fa 100%);
    }

    .error {
      color: #d90429;
      background: #ffccd5;
      border: 2px solid #ff4d6d;
      padding: 1rem;
      border-radius: 14px;
      margin-top: 1rem;
      display: none;
      font-weight: 700;
      text-align: center;
    }

    .bee-card {
      background: var(--card-bg);
      border: 3px solid #ffffff;
      border-radius: 20px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.04);
    }

    .bee-card h3 {
      font-family: 'Fredoka', cursive;
      margin-top: 0;
      color: #f2a65a;
      font-size: 1.3rem;
      border-bottom: 2px dashed #ffe5ec;
      padding-bottom: 0.6rem;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 1rem;
    }

    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
    }

    .coord-box {
      background: var(--pastel-green);
      padding: 1rem;
      border-radius: 14px;
      border: 2px solid #ffffff;
    }

    .coord-box.nether {
      background: var(--pastel-purple);
    }

    .coord-title {
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      color: #6b5b60;
      margin-bottom: 0.3rem;
    }

    .coord-value {
      font-family: monospace;
      font-weight: 700;
      font-size: 1.05rem;
      color: #2b2d42;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🐝 Bee NBT Extractor 🌸</h1>
  <div class="subtitle">Extract Overworld & Nether coordinates with ease ✨</div>
  
  <textarea id="nbtInput" placeholder="Paste your raw NBT JSON data here..."></textarea>
  <button onclick="parseNBT()">✨ Extract Coordinates ✨</button>

  <div id="errorBox" class="error"></div>
  <div id="results" style="margin-top: 2rem;"></div>
</div>

<script>
function snbtToJson(snbt) {
  let str = snbt;

  // 1. Remove Minecraft NBT typed array indicators [I; ...], [B; ...], [L; ...]
  str = str.replace(/\[\s*([IBL])\s*;/g, '[');

  // 2. Remove numeric suffixes on numbers: 0.0f, 0b, 100d, 12345L, 10s
  str = str.replace(/(-?\d+\.?\d*)[fFdDbBLlsS]\b/g, '$1');

  // 3. Quote unquoted keys (e.g. {components:...} or entity_data:...)
  str = str.replace(/([{,]\s*)([a-zA-Z0-9_\-\.\:]+)\s*:/g, (match, prefix, key) => {
    // If key is already quoted, leave it
    if (key.startsWith('"') || key.startsWith("'")) return match;
    return `${prefix}"${key}":`;
  });

  return str;
}

function parseNBT() {
  const input = document.getElementById('nbtInput').value.trim();
  const errorBox = document.getElementById('errorBox');
  const resultsDiv = document.getElementById('results');

  errorBox.style.display = 'none';
  resultsDiv.innerHTML = '';

  if (!input) {
    showError("Please paste your NBT JSON data first! 🌸");
    return;
  }

  try {
    const cleanJsonString = snbtToJson(input);
    const data = JSON.parse(cleanJsonString);

    const bees = data.components?.['minecraft:bees'] || data['minecraft:bees'] || [];

    if (bees.length === 0) {
      resultsDiv.innerHTML = `<div style="text-align:center; padding:2rem; font-weight:bold;">🍯 No bees or coordinate data found in this NBT!</div>`;
      return;
    }

    bees.forEach((bee, index) => {
      const entity = bee.entity_data || {};
      const flowerPos = entity.flower_pos; 
      const origin = entity.Paper?.Origin; 

      let cardHTML = `<div class="bee-card"><h3>🐝 Bee #${index + 1}</h3><div class="grid">`;

      if (flowerPos && flowerPos.length === 3) {
        const [fx, fy, fz] = flowerPos;
        cardHTML += `
          <div class="coord-box">
            <div class="coord-title">🌸 Flower Position (Overworld)</div>
            <div class="coord-value">X: ${fx}, Y: ${fy}, Z: ${fz}</div>
          </div>
          <div class="coord-box nether">
            <div class="coord-title">🔥 Flower Position (Nether)</div>
            <div class="coord-value">X: ${(fx / 8).toFixed(2)}, Y: ${fy}, Z: ${(fz / 8).toFixed(2)}</div>
          </div>`;
      }

      if (origin && origin.length === 3) {
        const [ox, oy, oz] = origin;
        cardHTML += `
          <div class="coord-box">
            <div class="coord-title">📍 Bee Origin (Overworld)</div>
            <div class="coord-value">X: ${Number(ox).toFixed(2)}, Y: ${Number(oy).toFixed(2)}, Z: ${Number(oz).toFixed(2)}</div>
          </div>
          <div class="coord-box nether">
            <div class="coord-title">🔮 Bee Origin (Nether)</div>
            <div class="coord-value">X: ${(ox / 8).toFixed(2)}, Y: ${Number(oy).toFixed(2)}, Z: ${(oz / 8).toFixed(2)}</div>
          </div>`;
      }

      cardHTML += `</div></div>`;
      resultsDiv.innerHTML += cardHTML;
    });

  } catch (err) {
    showError("Oops! Could not parse NBT formatting. Make sure you copied the full block text. 🌺");
  }
}

function showError(message) {
  const errorBox = document.getElementById('errorBox');
  errorBox.innerText = message;
  errorBox.style.display = 'block';
}
</script>

</body>
</html>
